server:
  port: ${ORDER_SERVICE_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_order}
    username: ${ORDER_DATABASE_USERNAME:petplanet_order}
    password: ${ORDER_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

pet:
  catalog:
    base-url: ${PET_CATALOG_URL:http://localhost:8080}

jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:pet-planet}
  audience: ${JWT_AUDIENCE:pet-planet}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
