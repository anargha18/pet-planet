# Pet Planet local stack. Start with `make up` (or `docker compose up -d --build`); see README.
#
# Memory: sized for a ~4 GB Docker Desktop VM (10 JVMs + Kafka + Postgres + Vite). 6–8 GB is more comfortable.
# Each Spring service is capped by SERVICE_MEM_LIMIT and uses a small-footprint JVM configuration.

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k}

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: ${SERVICE_MEM_LIMIT:-384m}
  networks:
    - pet-planet

x-health-timing: &health-timing
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 40s

x-infra-ready: &infra-ready
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-planet-postgres
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petplanet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-petplanet_db}
      CATALOG_DATABASE_NAME: ${CATALOG_DATABASE_NAME:-petplanet_catalog}
      CATALOG_DATABASE_USERNAME: ${CATALOG_DATABASE_USERNAME:-petplanet_catalog}
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-admin123}
      ORDER_DATABASE_NAME: ${ORDER_DATABASE_NAME:-petplanet_order}
      ORDER_DATABASE_USERNAME: ${ORDER_DATABASE_USERNAME:-petplanet_order}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:-admin123}
      INVENTORY_DATABASE_NAME: ${INVENTORY_DATABASE_NAME:-petplanet_inventory}
      INVENTORY_DATABASE_USERNAME: ${INVENTORY_DATABASE_USERNAME:-petplanet_inventory}
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-admin123}
      PAYMENT_DATABASE_NAME: ${PAYMENT_DATABASE_NAME:-petplanet_payment}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME:-petplanet_payment}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-admin123}
      NOTIFICATION_DATABASE_NAME: ${NOTIFICATION_DATABASE_NAME:-petplanet_notification}
      NOTIFICATION_DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME:-petplanet_notification}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-admin123}
      SHIPPING_DATABASE_NAME: ${SHIPPING_DATABASE_NAME:-petplanet_shipping}
      SHIPPING_DATABASE_USERNAME: ${SHIPPING_DATABASE_USERNAME:-petplanet_shipping}
      SHIPPING_DATABASE_PASSWORD: ${SHIPPING_DATABASE_PASSWORD:-admin123}
      DELIVERY_DATABASE_NAME: ${DELIVERY_DATABASE_NAME:-petplanet_delivery}
      DELIVERY_DATABASE_USERNAME: ${DELIVERY_DATABASE_USERNAME:-petplanet_delivery}
      DELIVERY_DATABASE_PASSWORD: ${DELIVERY_DATABASE_PASSWORD:-admin123}
      FULFILLMENT_DATABASE_NAME: ${FULFILLMENT_DATABASE_NAME:-petplanet_fulfillment}
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_DATABASE_USERNAME:-petplanet_fulfillment}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:-admin123}
      USER_DATABASE_NAME: ${USER_DATABASE_NAME:-petplanet_user}
      USER_DATABASE_USERNAME: ${USER_DATABASE_USERNAME:-petplanet_user}
      USER_DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD:-admin123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-petplanet_admin} -d $${POSTGRES_DB:-petplanet_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pet-planet

  kafka:
    image: apache/kafka:4.0.1
    container_name: pet-planet-kafka
    restart: unless-stopped
    mem_limit: 640m
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx384m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - pet-planet

  user-service:
    <<: *java-service
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: pet-planet-user
    environment:
      <<: *java-env
      USER_SERVICE_PORT: 8088
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/${USER_DATABASE_NAME:-petplanet_user}
      USER_DATABASE_USERNAME: ${USER_DATABASE_USERNAME:-petplanet_user}
      USER_DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD:-admin123}
      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN:-local-dev-internal-token-change-me}
      # user-service issues tokens: it is the only service that receives the private signing key.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY must be configured}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-pet-planet}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pet-planet}
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health || exit 1"]
    depends_on:
      postgres:
        condition: service_healthy

  pet-catalog-service:
    <<: *java-service
    build:
      context: .
      dockerfile: pet-catalog-service/Dockerfile
    container_name: pet-planet-catalog
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      CATALOG_DATABASE_URL: jdbc:postgresql://postgres:5432/${CATALOG_DATABASE_NAME:-petplanet_catalog}
      CATALOG_DATABASE_USERNAME: ${CATALOG_DATABASE_USERNAME:-petplanet_catalog}
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be configured}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-pet-planet}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pet-planet}
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
    depends_on: *infra-ready

  order-service:
    <<: *java-service
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: pet-planet-order
    environment:
      <<: *java-env
      ORDER_SERVICE_PORT: 8081
      ORDER_DATABASE_URL: jdbc:postgresql://postgres:5432/${ORDER_DATABASE_NAME:-petplanet_order}
      ORDER_DATABASE_USERNAME: ${ORDER_DATABASE_USERNAME:-petplanet_order}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD:-admin123}
      PET_CATALOG_URL: http://pet-catalog-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be configured}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-pet-planet}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pet-planet}
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
    depends_on:
      <<: *infra-ready
      pet-catalog-service:
        condition: service_healthy

  inventory-service:
    <<: *java-service
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: pet-planet-inventory
    environment:
      <<: *java-env
      INVENTORY_SERVICE_PORT: 8082
      INVENTORY_DATABASE_URL: jdbc:postgresql://postgres:5432/${INVENTORY_DATABASE_NAME:-petplanet_inventory}
      INVENTORY_DATABASE_USERNAME: ${INVENTORY_DATABASE_USERNAME:-petplanet_inventory}
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD:-admin123}
      INVENTORY_RESERVATION_TIMEOUT: ${INVENTORY_RESERVATION_TIMEOUT:-PT5M}
      INVENTORY_EXPIRATION_CHECK_DELAY_MS: ${INVENTORY_EXPIRATION_CHECK_DELAY_MS:-30000}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be configured}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_ISSUER: ${JWT_ISSUER:-pet-planet}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pet-planet}
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
    depends_on: *infra-ready

  payment-service:
    <<: *java-service
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: pet-planet-payment
    environment:
      <<: *java-env
      PAYMENT_SERVICE_PORT: 8083
      PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DATABASE_NAME:-petplanet_payment}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME:-petplanet_payment}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SIMULATION_RESULT: ${PAYMENT_SIMULATION_RESULT:-SUCCESS}
      PAYMENT_SIMULATION_DELAY: ${PAYMENT_SIMULATION_DELAY:-PT0S}
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
    depends_on: *infra-ready

  notification-service:
    <<: *java-service
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: pet-planet-notification
    environment:
      <<: *java-env
      NOTIFICATION_SERVICE_PORT: 8084
      NOTIFICATION_DATABASE_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DATABASE_NAME:-petplanet_notification}
      NOTIFICATION_DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME:-petplanet_notification}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
    depends_on: *infra-ready

  shipping-service:
    <<: *java-service
    build:
      context: .
      dockerfile: shipping-service/Dockerfile
    container_name: pet-planet-shipping
    environment:
      <<: *java-env
      SHIPPING_SERVICE_PORT: 8085
      SHIPPING_DATABASE_URL: jdbc:postgresql://postgres:5432/${SHIPPING_DATABASE_NAME:-petplanet_shipping}
      SHIPPING_DATABASE_USERNAME: ${SHIPPING_DATABASE_USERNAME:-petplanet_shipping}
      SHIPPING_DATABASE_PASSWORD: ${SHIPPING_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
    depends_on: *infra-ready

  delivery-tracking-service:
    <<: *java-service
    build:
      context: .
      dockerfile: delivery-tracking-service/Dockerfile
    container_name: pet-planet-delivery
    environment:
      <<: *java-env
      DELIVERY_SERVICE_PORT: 8086
      DELIVERY_DATABASE_URL: jdbc:postgresql://postgres:5432/${DELIVERY_DATABASE_NAME:-petplanet_delivery}
      DELIVERY_DATABASE_USERNAME: ${DELIVERY_DATABASE_USERNAME:-petplanet_delivery}
      DELIVERY_DATABASE_PASSWORD: ${DELIVERY_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health || exit 1"]
    depends_on: *infra-ready

  fulfillment-service:
    <<: *java-service
    build:
      context: .
      dockerfile: fulfillment-service/Dockerfile
    container_name: pet-planet-fulfillment
    environment:
      <<: *java-env
      FULFILLMENT_SERVICE_PORT: 8087
      FULFILLMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/${FULFILLMENT_DATABASE_NAME:-petplanet_fulfillment}
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_DATABASE_USERNAME:-petplanet_fulfillment}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD:-admin123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health || exit 1"]
    depends_on: *infra-ready

  gateway-service:
    <<: *java-service
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: pet-planet-gateway
    environment:
      <<: *java-env
      GATEWAY_PORT: 8089
      USER_SERVICE_URL: http://user-service:8088
      PET_CATALOG_URL: http://pet-catalog-service:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
      DELIVERY_SERVICE_URL: http://delivery-tracking-service:8086
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8087
      # The gateway only validates tokens: it receives the public key, never the private one.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY must be configured}
      JWT_ISSUER: ${JWT_ISSUER:-pet-planet}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pet-planet}
      USER_SERVICE_INTERNAL_TOKEN: ${USER_SERVICE_INTERNAL_TOKEN:-local-dev-internal-token-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${GATEWAY_PORT:-8089}:8089"
    healthcheck:
      <<: *health-timing
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health || exit 1"]
    depends_on:
      user-service:
        condition: service_healthy
      pet-catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      shipping-service:
        condition: service_started
      delivery-tracking-service:
        condition: service_started
      fulfillment-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: pet-planet-frontend
    restart: unless-stopped
    mem_limit: 512m
    environment:
      VITE_API_GATEWAY_URL: ${VITE_API_GATEWAY_URL:-http://localhost:8089}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      gateway-service:
        condition: service_healthy
    networks:
      - pet-planet

  # Optional (R-INF-07): browse topics, messages and dead-letter topics at http://localhost:8090.
  # Not started by default to save memory: `make kafka-ui` (docker compose --profile tools up -d kafka-ui).
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    container_name: pet-planet-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    mem_limit: 384m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
      KAFKA_CLUSTERS_0_NAME: pet-planet
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

volumes:
  postgres-data:
  kafka-data:

networks:
  pet-planet:
    name: pet-planet
