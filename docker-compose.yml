services:
  postgres:
    image: postgres:16-alpine
    container_name: pet-planet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CATALOG_DATABASE_NAME: ${CATALOG_DATABASE_NAME}
      CATALOG_DATABASE_USERNAME: ${CATALOG_DATABASE_USERNAME}
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD}
      ORDER_DATABASE_NAME: ${ORDER_DATABASE_NAME}
      ORDER_DATABASE_USERNAME: ${ORDER_DATABASE_USERNAME}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD}
      INVENTORY_DATABASE_NAME: ${INVENTORY_DATABASE_NAME}
      INVENTORY_DATABASE_USERNAME: ${INVENTORY_DATABASE_USERNAME}
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD}
      PAYMENT_DATABASE_NAME: ${PAYMENT_DATABASE_NAME}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD}
      NOTIFICATION_DATABASE_NAME: ${NOTIFICATION_DATABASE_NAME}
      NOTIFICATION_DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD}
      SHIPPING_DATABASE_NAME: ${SHIPPING_DATABASE_NAME}
      SHIPPING_DATABASE_USERNAME: ${SHIPPING_DATABASE_USERNAME}
      SHIPPING_DATABASE_PASSWORD: ${SHIPPING_DATABASE_PASSWORD}
      DELIVERY_DATABASE_NAME: ${DELIVERY_DATABASE_NAME}
      DELIVERY_DATABASE_USERNAME: ${DELIVERY_DATABASE_USERNAME}
      DELIVERY_DATABASE_PASSWORD: ${DELIVERY_DATABASE_PASSWORD}
      FULFILLMENT_DATABASE_NAME: ${FULFILLMENT_DATABASE_NAME}
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_DATABASE_USERNAME}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD}
      USER_DATABASE_NAME: ${USER_DATABASE_NAME}
      USER_DATABASE_USERNAME: ${USER_DATABASE_USERNAME}
      USER_DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pet-planet

  pet-catalog-service:
    build:
      context: ./pet-catalog-service
    container_name: pet-planet-catalog
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      CATALOG_DATABASE_URL: jdbc:postgresql://postgres:5432/${CATALOG_DATABASE_NAME}
      CATALOG_DATABASE_USERNAME: ${CATALOG_DATABASE_USERNAME}
      CATALOG_DATABASE_PASSWORD: ${CATALOG_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${PET_CATALOG_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  order-service:
    build:
      context: ./order-service
    container_name: pet-planet-order
    restart: unless-stopped
    environment:
      ORDER_SERVICE_PORT: 8081
      ORDER_DATABASE_URL: jdbc:postgresql://postgres:5432/${ORDER_DATABASE_NAME}
      ORDER_DATABASE_USERNAME: ${ORDER_DATABASE_USERNAME}
      ORDER_DATABASE_PASSWORD: ${ORDER_DATABASE_PASSWORD}
      PET_CATALOG_URL: http://pet-catalog-service:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${ORDER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      pet-catalog-service:
        condition: service_started
    networks:
      - pet-planet

  inventory-service:
    build:
      context: ./inventory-service
    container_name: pet-planet-inventory
    restart: unless-stopped
    environment:
      INVENTORY_SERVICE_PORT: 8082
      INVENTORY_DATABASE_URL: jdbc:postgresql://postgres:5432/${INVENTORY_DATABASE_NAME}
      INVENTORY_DATABASE_USERNAME: ${INVENTORY_DATABASE_USERNAME}
      INVENTORY_DATABASE_PASSWORD: ${INVENTORY_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${INVENTORY_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  payment-service:
    build:
      context: ./payment-service
    container_name: pet-planet-payment
    restart: unless-stopped
    environment:
      PAYMENT_SERVICE_PORT: 8083
      PAYMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/${PAYMENT_DATABASE_NAME}
      PAYMENT_DATABASE_USERNAME: ${PAYMENT_DATABASE_USERNAME}
      PAYMENT_DATABASE_PASSWORD: ${PAYMENT_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SIMULATION_RESULT: ${PAYMENT_SIMULATION_RESULT:-SUCCESS}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  notification-service:
    build:
      context: ./notification-service
    container_name: pet-planet-notification
    restart: unless-stopped
    environment:
      NOTIFICATION_SERVICE_PORT: 8084
      NOTIFICATION_DATABASE_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DATABASE_NAME}
      NOTIFICATION_DATABASE_USERNAME: ${NOTIFICATION_DATABASE_USERNAME}
      NOTIFICATION_DATABASE_PASSWORD: ${NOTIFICATION_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  shipping-service:
    build:
      context: ./shipping-service
    container_name: pet-planet-shipping
    restart: unless-stopped
    environment:
      SHIPPING_SERVICE_PORT: 8085
      SHIPPING_DATABASE_URL: jdbc:postgresql://postgres:5432/${SHIPPING_DATABASE_NAME}
      SHIPPING_DATABASE_USERNAME: ${SHIPPING_DATABASE_USERNAME}
      SHIPPING_DATABASE_PASSWORD: ${SHIPPING_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${SHIPPING_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  delivery-tracking-service:
    build:
      context: ./delivery-tracking-service
    container_name: pet-planet-delivery
    restart: unless-stopped
    environment:
      DELIVERY_SERVICE_PORT: 8086
      DELIVERY_DATABASE_URL: jdbc:postgresql://postgres:5432/${DELIVERY_DATABASE_NAME}
      DELIVERY_DATABASE_USERNAME: ${DELIVERY_DATABASE_USERNAME}
      DELIVERY_DATABASE_PASSWORD: ${DELIVERY_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${DELIVERY_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  fulfillment-service:
    build:
      context: ./fulfillment-service
    container_name: pet-planet-fulfillment
    restart: unless-stopped
    environment:
      FULFILLMENT_SERVICE_PORT: 8087
      FULFILLMENT_DATABASE_URL: jdbc:postgresql://postgres:5432/${FULFILLMENT_DATABASE_NAME}
      FULFILLMENT_DATABASE_USERNAME: ${FULFILLMENT_DATABASE_USERNAME}
      FULFILLMENT_DATABASE_PASSWORD: ${FULFILLMENT_DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "${FULFILLMENT_SERVICE_PORT:-8087}:8087"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - pet-planet

  user-service:
    build:
      context: ./user-service
    container_name: pet-planet-user
    restart: unless-stopped
    environment:
      USER_SERVICE_PORT: 8088
      USER_DATABASE_URL: jdbc:postgresql://postgres:5432/${USER_DATABASE_NAME}
      USER_DATABASE_USERNAME: ${USER_DATABASE_USERNAME}
      USER_DATABASE_PASSWORD: ${USER_DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-secret}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
    ports:
      - "${USER_SERVICE_PORT:-8088}:8088"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pet-planet

  kafka:
    image: apache/kafka:4.0.1
    container_name: pet-planet-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: DOCKER://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: DOCKER://kafka:29092,HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: DOCKER:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - pet-planet

volumes:
  postgres-data:
  kafka-data:

networks:
  pet-planet:
    name: pet-planet
