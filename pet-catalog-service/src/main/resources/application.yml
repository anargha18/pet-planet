server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: pet-catalog-service
  datasource:
    url: ${CATALOG_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_catalog}
    username: ${CATALOG_DATABASE_USERNAME:petplanet_catalog}
    password: ${CATALOG_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:pet-planet}
  audience: ${JWT_AUDIENCE:pet-planet}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
