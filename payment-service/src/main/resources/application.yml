server:
  port: ${PAYMENT_SERVICE_PORT:8083}

spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_payment}
    username: ${PAYMENT_DATABASE_USERNAME:petplanet_payment}
    password: ${PAYMENT_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Values are plain JSON strings; platform-commons converts them to the listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # The outbox relay sends the stored JSON string as-is (no Java type headers).
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

payment:
  simulation-result: ${PAYMENT_SIMULATION_RESULT:SUCCESS}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Correlation ID of the event being processed (set by platform-commons from Kafka headers) in every log line.
logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
