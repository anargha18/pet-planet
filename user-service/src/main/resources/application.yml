server:
  port: ${USER_SERVICE_PORT:8088}

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_user}
    username: ${USER_DATABASE_USERNAME:petplanet_user}
    password: ${USER_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:pet-planet}
  audience: ${JWT_AUDIENCE:pet-planet}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
