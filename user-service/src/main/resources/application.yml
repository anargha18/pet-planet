server:
  port: ${USER_SERVICE_PORT:8088}

spring:
  application:
    name: user-service
  datasource:
    url: ${USER_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_user}
    username: ${USER_DATABASE_USERNAME:petplanet_user}
    password: ${USER_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

internal:
  service-token: ${USER_SERVICE_INTERNAL_TOKEN:}

# Token issuance (user-service is the only holder of the private signing key) and, like every service,
# token validation with the public key (platform-commons). No key defaults: run scripts/generate-dev-keys.sh.
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  issuer: ${JWT_ISSUER:pet-planet}
  audience: ${JWT_AUDIENCE:pet-planet}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Correlation ID of the current HTTP request (platform-commons CorrelationIdFilter) in every log line.
logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"
