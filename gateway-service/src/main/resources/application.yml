server:
  port: ${GATEWAY_PORT:8089}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "${FRONTEND_ORIGIN:http://localhost:5173}"
            allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8088}
  pet-catalog-url: ${PET_CATALOG_URL:http://localhost:8080}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
