server:
  port: ${GATEWAY_PORT:8089}

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - "GET"
              - "POST"
              - "PUT"
              - "PATCH"
              - "DELETE"
              - "OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

gateway:
  user-service-url: ${USER_SERVICE_URL:http://localhost:8088}
  pet-catalog-url: ${PET_CATALOG_URL:http://localhost:8080}
  order-service-url: ${ORDER_SERVICE_URL:http://localhost:8081}
  inventory-service-url: ${INVENTORY_SERVICE_URL:http://localhost:8082}
  payment-service-url: ${PAYMENT_SERVICE_URL:http://localhost:8083}
  notification-service-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
  shipping-service-url: ${SHIPPING_SERVICE_URL:http://localhost:8085}
  delivery-service-url: ${DELIVERY_SERVICE_URL:http://localhost:8086}
  fulfillment-service-url: ${FULFILLMENT_SERVICE_URL:http://localhost:8087}
