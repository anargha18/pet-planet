server:
  port: ${FULFILLMENT_SERVICE_PORT:8087}

spring:
  application:
    name: fulfillment-service
  datasource:
    url: ${FULFILLMENT_DATABASE_URL:jdbc:postgresql://localhost:5432/petplanet_fulfillment}
    username: ${FULFILLMENT_DATABASE_USERNAME:petplanet_fulfillment}
    password: ${FULFILLMENT_DATABASE_PASSWORD:admin123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fulfillment-tracking-projection
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Values are plain JSON strings; platform-commons converts them to the listener's parameter type.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Only used to publish failed records to <topic>.DLT; this projection emits no events.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Correlation ID of the event being processed (set by platform-commons from Kafka headers) in every log line.
logging:
  pattern:
    level: "%5p [corr=%X{correlationId:-}]"

# Token validation (platform-commons): public key only. No default: run scripts/generate-dev-keys.sh.
jwt:
  public-key: ${JWT_PUBLIC_KEY:}
  issuer: ${JWT_ISSUER:pet-planet}
  audience: ${JWT_AUDIENCE:pet-planet}

# Tracking projection (R-SVC-01): orders still CREATED/PAYMENT_PENDING after this long are escalated.
fulfillment:
  escalation:
    stuck-after: ${FULFILLMENT_STUCK_AFTER:PT10M}
    check-interval-ms: ${FULFILLMENT_ESCALATION_CHECK_MS:60000}
